        <style>
            * { box-sizing: border-box; }
            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                color: #f8fafc;
                font-family: "Segoe UI", Arial, sans-serif;
                background: radial-gradient(circle at top, #334b73 0, #18243a 42%, #101827 100%);
            }
            main {
                width: min(100%, 680px);
                padding: 64px 36px;
                text-align: center;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.16);
                border-radius: 24px;
                box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
                backdrop-filter: blur(10px);
            }
            h1 {
                margin: 0 0 18px;
                font-size: clamp(2rem, 6vw, 3.4rem);
                line-height: 1.15;
                letter-spacing: -0.04em;
            }
            p { margin: 0 0 30px; color: #c7d2e3; font-size: 1.08rem; }
            a {
                display: inline-block;
                padding: 13px 22px;
                color: #101827;
                font-weight: 700;
                text-decoration: none;
                background: #f87171;
                border-radius: 999px;
                transition: transform 160ms ease, background 160ms ease;
            }
            a:hover { transform: translateY(-2px); background: #fb8b8b; }
            a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
        </style>
    </head>
